[platformio]
src_dir = .
default_envs = cyd

[env:cyd]
platform = espressif32@6.11.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
	impulseadventure/GUIslice @ ^0.17.0
	bodmer/TFT_eSPI @ ^2.5.43
	paulstoffregen/XPT2046_Touchscreen @ 0.0.0-alpha+sha.26b691b2c8
	adafruit/Adafruit Unified Sensor @ ^1.1.14
	adafruit/Adafruit BME280 Library @ ^2.2.4
	adafruit/DHT sensor library @ ^1.4.6
	tzapu/WiFiManager @ ^2.0.17
	bblanchon/ArduinoJson @ ^6.21.4
	256dpi/MQTT @ ^2.5.2

build_flags =
	-I.
	-D HARDWARE_CYD=1
	-D USER_SETUP_LOADED=1
	-D ILI9341_2_DRIVER=1
	-D USE_HSPI_PORT=1
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D TOUCH_CS=33
	-D SUPPORT_TRANSACTIONS=1
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D LOAD_FONT7=1
	-D LOAD_FONT8=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=20000000
	-D SPI_TOUCH_FREQUENCY=2500000
	-D USER_CONFIG_LOADED=1
	-D USER_CONFIG_INC_FILE=1
	-D USER_CONFIG_INC_FNAME=<guislice_custom_cfg.h>

[env:az_touch]
platform = espressif32@6.11.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
	impulseadventure/GUIslice @ ^0.17.0
	bodmer/TFT_eSPI @ ^2.5.43
	paulstoffregen/XPT2046_Touchscreen @ 0.0.0-alpha+sha.26b691b2c8
	adafruit/Adafruit Unified Sensor @ ^1.1.14
	adafruit/Adafruit BME280 Library @ ^2.2.4
	adafruit/DHT sensor library @ ^1.4.6
	tzapu/WiFiManager @ ^2.0.17
	bblanchon/ArduinoJson @ ^6.21.4
	256dpi/MQTT @ ^2.5.2

build_flags =
	-I.
	-D USER_SETUP_LOADED=1
	-D ILI9341_DRIVER=1
	-D TFT_MISO=19
	-D TFT_MOSI=23
	-D TFT_SCLK=18
	-D TFT_CS=5
	-D TFT_DC=4
	-D TFT_RST=22
	-D TOUCH_CS=14
	-D SUPPORT_TRANSACTIONS=1
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D LOAD_FONT7=1
	-D LOAD_FONT8=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=20000000
	-D SPI_TOUCH_FREQUENCY=2500000
	-D USER_CONFIG_LOADED=1
	-D USER_CONFIG_INC_FILE=1
	-D USER_CONFIG_INC_FNAME=<guislice_custom_cfg.h>
